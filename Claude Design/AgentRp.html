<head>

<script>
// ── Theme ──────────────────────────────────────────────────────────────────
const DARK = {
  '--c-bg':        '#0d0b09',
  '--c-surface':   '#131210',
  '--c-surface2':  '#1b1917',
  '--c-surface3':  '#232120',
  '--c-surface4':  '#2c2a27',
  '--c-border':    'rgba(255,255,255,0.07)',
  '--c-borderMid': 'rgba(255,255,255,0.13)',
  '--c-text':      '#f0ede8',
  '--c-text2':     '#9a9590',
  '--c-text3':     '#847e78',
  '--c-amberBg':   'oklch(30% 0.06 68)',
  '--c-blueBg':    'oklch(28% 0.07 245)',
  '--c-roseBg':    'oklch(28% 0.06 15)',
  '--c-violetBg':  'oklch(28% 0.06 285)',
  '--c-emeraldBg': 'oklch(28% 0.06 160)',
};
const LIGHT = {
  '--c-bg':        '#f5f2ec',
  '--c-surface':   '#fdfaf6',
  '--c-surface2':  '#f0ece5',
  '--c-surface3':  '#e6e0d8',
  '--c-surface4':  '#d8d1c6',
  '--c-border':    'rgba(0,0,0,0.07)',
  '--c-borderMid': 'rgba(0,0,0,0.13)',
  '--c-text':      '#1a1612',
  '--c-text2':     '#6b6560',
  '--c-text3':     '#767068',
  '--c-amberBg':   'oklch(93% 0.05 68)',
  '--c-blueBg':    'oklch(91% 0.05 245)',
  '--c-roseBg':    'oklch(92% 0.05 15)',
  '--c-violetBg':  'oklch(91% 0.05 285)',
  '--c-emeraldBg': 'oklch(91% 0.05 160)',
};
function applyVars(vars) {
  const r = document.documentElement;
  for (const [k,v] of Object.entries(vars)) r.style.setProperty(k, v);
}
window.__applyTheme = function(t) {
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyVars((t === 'dark' || (t === 'system' && prefersDark)) ? DARK : LIGHT);
};
const saved = localStorage.getItem('agentRpTheme') || 'system';
window.__applyTheme(saved);
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--c-bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--c-text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #root { width: 100%; height: 100%; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--c-surface4); border-radius: 4px; }
  select option { background: var(--c-surface3); color: var(--c-text); }
</style>
